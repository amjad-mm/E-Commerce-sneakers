<header class="sr-admin-header">
  <div class="sr-header-left">
    <!-- Mobile Hamburger Toggle -->
    <button type="button" class="sr-mobile-menu-btn" (click)="toggleSidebar.emit()" aria-label="Toggle Navigation">
      <span class="sr-menu-icon">☰</span>
      <span class="sr-menu-text">MENU</span>
    </button>

    <div class="sr-header-breadcrumbs">
      <div class="sr-header-tag">
        <span class="sr-live-dot"></span>
        <span>PROTOCOL // ACTIVE</span>
      </div>
      <h1 class="sr-header-title">{{ getPageTitle() }}</h1>
    </div>
  </div>

  <div class="sr-header-right">
    <!-- Telemetry Clock -->
    <div class="sr-telemetry-date">
      <span class="sr-date-label">SYSTEM_EPOCH:</span>
      <span class="sr-date-val">{{ today | date:'dd MMM yyyy' | uppercase }}</span>
    </div>

    <!-- Theme Toggle Control -->
    <button
      type="button"
      class="sr-theme-toggle-btn"
      (click)="toggleTheme()"
      [title]="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
      aria-label="Toggle Dark / Light Mode"
    >
      @if (isDark) {
        <svg xmlns="http://www.w3.org/2000/svg" class="sr-theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span class="sr-theme-label">LIGHT</span>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="sr-theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span class="sr-theme-label">DARK</span>
      }
    </button>

    <!-- Admin User Badge -->
    @if (currentUser$ | async; as user) {
      <div class="sr-header-user">
        <span class="sr-role-pill">{{ user.role | uppercase }}</span>
        <span class="sr-user-name">{{ user.name || 'ROOT ADMIN' }}</span>
      </div>
    }

    <!-- Quick store link -->
    <a routerLink="/" class="sr-store-link" title="Open customer storefront">
      <span>STOREFRONT</span>
      <span class="sr-link-arrow">↗</span>
    </a>
  </div>
</header>
