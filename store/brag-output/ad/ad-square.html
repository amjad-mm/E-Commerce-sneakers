<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#faf7f2;font-family:system-ui,-apple-system,sans-serif;color:#111;overflow:hidden}
.ticker{background:#111;color:#faf7f2;font-size:22px;font-weight:800;letter-spacing:2px;padding:12px 24px}
.hero{padding:32px 56px 28px}
.badge{display:inline-block;background:#111;color:#d9f13d;font-size:22px;font-weight:800;padding:8px 18px;letter-spacing:2px}
h1{font-size:150px;line-height:1.02;font-weight:900;letter-spacing:-3px;margin:22px 0 28px}
.lime{background:#d9f13d;padding:0 18px;border:5px solid #111;box-shadow:8px 8px 0 #111;display:inline-block}
.sub{font-size:28px;font-weight:700;margin-top:18px}
.panel{margin:18px 56px 0;background:#fff;border:4px solid #111;box-shadow:10px 10px 0 #111;display:flex;overflow:hidden}
.photo{width:520px;height:420px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:32px;flex:1}
.info h2{font-size:44px;font-weight:900;line-height:1}
.tag{display:inline-block;background:#d9f13d;border:3px solid #111;font-size:20px;font-weight:800;padding:6px 12px;margin:14px 0;box-shadow:4px 4px 0 #111}
.price{font-size:52px;font-weight:900}
.cta{margin-top:14px;background:#111;color:#d9f13d;font-size:30px;font-weight:900;padding:16px;text-align:center;letter-spacing:1px}
.foot{padding:22px 56px;font-size:22px;font-weight:700;color:#111;display:flex;justify-content:space-between}
</style></head>
<body>
<div class="ticker">RAW ENGINEERING // EST. 2026&nbsp;&nbsp;+&nbsp;&nbsp;FW-2026 DROP 04 LIVE</div>
<div class="hero">
<div class="badge">DROP 04 // PROTOCOL ACTIVE</div>
<h1>BUILT<br>TO <span class="lime">MOVE.</span></h1>
<p class="sub">RAW ARCHIVAL RIGS // KINETIC PROPULSION CHASSIS</p>
</div>
<div class="panel">
<div class="photo"><img src="product1.png" alt="Pegasus Trail 4"></div>
<div class="info">
<h2>Pegasus Trail 4 GORE-TEX</h2>
<div class="tag">NIKE // TRAIL ESSENTIAL</div>
<p style="font-size:24px;font-weight:700">BLACK / REFLECTIVE / VOLT</p>
<p class="price">₹14,495</p>
<div class="cta">SHOP DROP 04 →</div>
</div>
</div>
<div class="foot"><span>SOLE//RAW</span><span>Move Different.</span></div>
</body></html>
